<button onclick="run()">Decode supplied audio</button><pre id="result"></pre><script>async function run(){const c=new AudioContext();for(const f of ["intro-engine.wav","intro-skid.wav","intro-door.wav","intro-breach.wav","record-search.wav","record-found.wav","corporate-laugh.wav","escape-step.wav","corporate-voice.mp3","mc-voice.mp3"]){const b=await c.decodeAudioData(await(await fetch('audio/'+f)).arrayBuffer());let a=b.getChannelData(0),first=0,last=a.length-1;while(first<a.length&&Math.abs(a[first])<.01)first++;while(last>first&&Math.abs(a[last])<.01)last--;document.getElementById('result').textContent+=f+' '+JSON.stringify({duration:b.duration,first:first/b.sampleRate,last:last/b.sampleRate})+'\n';}}</script>
